name: Zeroeye diagnostic validation
on:
  workflow_dispatch:
  push:
    branches:
      - test/diagnostic-bundle-validation
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run diagnostic validator tests
        run: python3 -m unittest discover -s tests -p 'test_diagnostic_validator.py' -v
      - name: Install Lua and Haskell build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            lua5.4 \
            libghc-aeson-dev \
            libghc-yaml-dev \
            libghc-unordered-containers-dev \
            libghc-http-types-dev \
            libghc-wai-dev \
            libghc-warp-dev \
            libghc-wai-extra-dev \
            libghc-random-dev
          command -v luac
          ghc-pkg list yaml
      - name: Attempt full upstream build
        id: build
        continue-on-error: true
        run: python3 build.py
      - name: Show diagnostic artifacts
        if: always()
        run: |
          ls -lah diagnostic/ || true
          find diagnostic -maxdepth 1 -type f -name 'build-*' -print || true
      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeroeye-diagnostics
          path: |
            diagnostic/build-*.logd
            diagnostic/build-*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Fail if upstream build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
